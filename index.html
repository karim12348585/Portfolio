<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <title>Karim Souissi — AI Engineer</title>
    <meta
      name="description"
      content="Karim Souissi — AI Engineer building production-ready AI systems: multi-agent LLMs, RAG, agentic pipelines, and ML that turns complex data into intelligent decisions."
    />
    <meta name="author" content="Karim Souissi" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Karim Souissi — AI Engineer" />
    <meta
      property="og:description"
      content="I build production-ready AI systems that transform complex data into intelligent decisions."
    />
    <meta property="og:image" content="/og.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Karim Souissi — AI Engineer" />
    <meta
      name="twitter:description"
      content="I build production-ready AI systems that transform complex data into intelligent decisions."
    />

    <!-- Apply the stored theme before paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem("portfolio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
